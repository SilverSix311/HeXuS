name: Test

on:
  workflow_dispatch:
  # Also run on PR to main (free on Linux)
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Run tests
        run: cargo test --workspace

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
